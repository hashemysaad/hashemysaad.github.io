<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hashem Y. Saad | IBM Power Systems & AIX Engineer</title>
  
  <!-- Cyberpunk / Terminal Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --cyan: #00f3ff;
      --cyan-glow: rgba(0, 243, 255, 0.45);
      --magenta: #ff007f;
      --magenta-glow: rgba(255, 0, 127, 0.45);
      --bg: #06080d;
      --panel-bg: rgba(12, 16, 24, 0.9);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(0, 243, 255, 0.12) 0%, transparent 65%),
        linear-gradient(rgba(255, 0, 127, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 127, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      color: #ffffff;
      font-family: 'Chakra Petch', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
    }

    /* Outer Cyber HUD Container */
    .cyber-card {
      width: 100%;
      max-width: 440px;
      background: var(--panel-bg);
      border: 1px solid rgba(0, 243, 255, 0.35);
      padding: 26px 22px;
      position: relative;
      clip-path: polygon(
        0 18px, 18px 0,
        calc(100% - 18px) 0, 100% 18px,
        100% calc(100% - 18px), calc(100% - 18px) 100%,
        18px 100%, 0 calc(100% - 18px)
      );
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9), inset 0 0 24px rgba(0, 243, 255, 0.06);
    }

    /* Terminal HUD Status Header */
    .hud-header {
      display: flex;
      justify-content: space-between;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: var(--cyan);
      letter-spacing: 2px;
      margin-bottom: 20px;
      border-bottom: 1px dashed rgba(0, 243, 255, 0.3);
      padding-bottom: 8px;
    }

    .hud-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .hud-status::before {
      content: '';
      width: 7px;
      height: 7px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyan);
      animation: pulse 2s infinite;
    }

    /* Avatar Frame Optimized for Portrait */
    .avatar-wrapper {
      position: relative;
      width: 100%;
      height: 320px;
      margin-bottom: 22px;
      border: 2px solid var(--magenta);
      box-shadow: 0 0 20px var(--magenta-glow);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
      overflow: hidden;
      background: #000;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      filter: contrast(1.1) brightness(0.95);
      display: block;
    }

    /* CRT Scanlines Overlay */
    .scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.4) 0px,
        rgba(0, 0, 0, 0.4) 2px,
        transparent 2px,
        transparent 4px
      );
    }

    /* Animated Cyber Scanner Bar */
    .scan-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
      opacity: 0.6;
      animation: scan 4s linear infinite;
    }

    /* Name Heading with Cyan Neon Glow */
    .name-title {
      text-align: center;
      font-size: 2.3rem;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: 3px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow:
        0 0 6px var(--cyan),
        0 0 14px var(--cyan),
        0 0 28px var(--cyan-glow);
      margin-bottom: 8px;
    }

    /* Role Subtitle */
    .role-badge {
      text-align: center;
      font-family: 'Share Tech Mono', monospace;
      color: var(--magenta);
      font-size: 0.82rem;
      line-height: 1.4;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 22px;
      text-shadow: 0 0 8px var(--magenta-glow);
    }

    /* Skills Grid */
    .tech-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }

    .tech-box {
      background: rgba(255, 0, 127, 0.05);
      border: 1px solid rgba(255, 0, 127, 0.35);
      padding: 10px 8px;
      text-align: center;
      transition: all 0.25s ease;
    }

    .tech-box:hover {
      border-color: var(--cyan);
      background: rgba(0, 243, 255, 0.1);
      box-shadow: 0 0 14px var(--cyan-glow);
      transform: translateY(-2px);
    }

    .tech-box .tech-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.65);
      display: block;
      margin-bottom: 3px;
    }

    .tech-box .tech-val {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--magenta);
      letter-spacing: 1px;
    }

    .tech-box:hover .tech-val {
      color: var(--cyan);
    }

    /* Action Links */
    .hud-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.88rem;
      letter-spacing: 2px;
      padding: 12px;
      color: var(--cyan);
      border: 1px solid var(--cyan);
      background: rgba(0, 243, 255, 0.04);
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      transition: all 0.25s ease;
      text-transform: uppercase;
    }

    .hud-btn:hover {
      background: var(--cyan);
      color: #000;
      font-weight: 700;
      box-shadow: 0 0 18px var(--cyan-glow);
    }

    .hud-btn.primary {
      color: #000;
      background: var(--magenta);
      border-color: var(--magenta);
      font-weight: 700;
      box-shadow: 0 0 12px var(--magenta-glow);
    }

    .hud-btn.primary:hover {
      background: #ff3399;
      color: #ffffff;
      box-shadow: 0 0 22px rgba(255, 51, 153, 0.8);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes scan {
      0% { top: 0; opacity: 0.8; }
      50% { opacity: 0.3; }
      100% { top: 100%; opacity: 0.8; }
    }
  </style>
</head>
<body>

  <main class="cyber-card">
    <!-- Telemetry Header -->
    <div class="hud-header">
      <span class="hud-status">STATUS: PRODUCTION ACTIVE</span>
      <span>NODE: AIX-SYS-01</span>
    </div>

    <!-- Portrait Photo with HUD Scanline & Laser -->
    <div class="avatar-wrapper">
      <img src="IMG_20240529_090542.jpg" alt="Hashem Y. Saad" />
      <div class="scanlines"></div>
      <div class="scan-bar"></div>
    </div>

    <!-- Identity -->
    <h1 class="name-title">HASHEM Y.<br>SAAD</h1>
    
    <!-- Title / Core Focus -->
    <p class="role-badge">
      SR. SOFTWARE DEVELOPMENT SUPPORT<br>
      POWER SYSTEMS &bull; VIOS &bull; HMC &bull; AIX
    </p>

    <!-- Architecture & Core Specializations Grid -->
    <div class="tech-grid">
      <div class="tech-box">
        <span class="tech-label">HARDWARE PLATFORM</span>
        <span class="tech-val">POWER SYSTEMS</span>
      </div>
      <div class="tech-box">
        <span class="tech-label">CORE SYSTEM</span>
        <span class="tech-val">IBM AIX</span>
      </div>
      <div class="tech-box">
        <span class="tech-label">VIRTUALIZATION</span>
        <span class="tech-val">PowerVM / VIOS</span>
      </div>
      <div class="tech-box">
        <span class="tech-label">MANAGEMENT CONSOLE</span>
        <span class="tech-val">HMC MGMT</span>
      </div>
    </div>

    <!-- Contact & Action Buttons -->
    <div class="hud-actions">
      <a href="https://www.linkedin.com/in/hashem-y-saad-86a59213a" target="_blank" rel="noopener noreferrer" class="hud-btn primary">CONNECT ON LINKEDIN</a>
      <a href="mailto:your-email@domain.com" class="hud-btn">INITIATE CONTACT</a>
    </div>
  </main>

</body>
</html>
